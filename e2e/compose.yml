# E2E-only infrastructure. The core creates its bucket through ensure_bucket;
# no external mc image or bucket bootstrap is needed.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booskiff
      POSTGRES_PASSWORD: booskiff
      POSTGRES_DB: booskiff
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booskiff -d booskiff"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    build:
      context: .
      dockerfile: Minio.Containerfile
    command: server /data
    environment:
      MINIO_ROOT_USER: booskiff
      MINIO_ROOT_PASSWORD: booskiff-secret
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  miniodata:
